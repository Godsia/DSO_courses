name: CI

on:
  push:
    branches: [main, p07-container-hardening]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker compose build

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Tag image for Trivy
        run: |
          docker compose build
          IMAGE_ID=$(docker compose images -q app)
          docker tag $IMAGE_ID secure-app:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Test container
        run: |
          docker compose up -d
          sleep 10
          curl -f http://localhost:8000/ || exit 1
          USER_ID=$(docker compose exec -T app id -u)
          if [ "$USER_ID" = "0" ]; then
            echo "ERROR: Container running as root!"
            exit 1
          fi

      - name: Check container health
        run: |
          sleep 5
          docker compose ps | grep "healthy" || exit 1

