name: Security - SBOM & SCA

on:
  workflow_dispatch:
  push:
    paths:
      - "requirements*.txt"
      - "*.py"
      - ".github/workflows/ci-sbom-sca.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "*.py"
      - ".github/workflows/ci-sbom-sca.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-sca:
    name: Generate SBOM & SCA Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create evidence directory
        run: mkdir -p EVIDENCE/P09

      - name: Generate SBOM with Syft
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            anchore/syft:latest \
            packages dir:. -o cyclonedx-json > EVIDENCE/P09/sbom.json

      - name: Run SCA scan with Grype
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            anchore/grype:latest \
            sbom:/work/EVIDENCE/P09/sbom.json -o json > EVIDENCE/P09/sca_report.json || true

      - name: Generate SCA summary
        run: |
          if [ -f EVIDENCE/P09/sca_report.json ]; then
            echo "# SCA Vulnerability Summary" > EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md
            echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> EVIDENCE/P09/sca_summary.md
            echo "Commit: ${{ github.sha }}" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md
            
            docker run --rm -v ${{ github.workspace }}:/work -w /work alpine/jq:latest \
              '[.matches[] | select(.vulnerability.severity == "Critical")] | length' \
              EVIDENCE/P09/sca_report.json > /tmp/critical.txt 2>/dev/null || echo "0" > /tmp/critical.txt
            docker run --rm -v ${{ github.workspace }}:/work -w /work alpine/jq:latest \
              '[.matches[] | select(.vulnerability.severity == "High")] | length' \
              EVIDENCE/P09/sca_report.json > /tmp/high.txt 2>/dev/null || echo "0" > /tmp/high.txt
            docker run --rm -v ${{ github.workspace }}:/work -w /work alpine/jq:latest \
              '[.matches[] | select(.vulnerability.severity == "Medium")] | length' \
              EVIDENCE/P09/sca_report.json > /tmp/medium.txt 2>/dev/null || echo "0" > /tmp/medium.txt
            docker run --rm -v ${{ github.workspace }}:/work -w /work alpine/jq:latest \
              '[.matches[] | select(.vulnerability.severity == "Low")] | length' \
              EVIDENCE/P09/sca_report.json > /tmp/low.txt 2>/dev/null || echo "0" > /tmp/low.txt
            
            CRITICAL=$(cat /tmp/critical.txt || echo "0")
            HIGH=$(cat /tmp/high.txt || echo "0")
            MEDIUM=$(cat /tmp/medium.txt || echo "0")
            LOW=$(cat /tmp/low.txt || echo "0")
            
            echo "## Severity Distribution" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md
            echo "- **Critical:** $CRITICAL" >> EVIDENCE/P09/sca_summary.md
            echo "- **High:** $HIGH" >> EVIDENCE/P09/sca_summary.md
            echo "- **Medium:** $MEDIUM" >> EVIDENCE/P09/sca_summary.md
            echo "- **Low:** $LOW" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md
            echo "## Notes" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md
            echo "See policy/waivers.yml for exceptions and planned fixes." >> EVIDENCE/P09/sca_summary.md
          else
            echo "# SCA Summary" > EVIDENCE/P09/sca_summary.md
            echo "No vulnerabilities found or report generation failed." >> EVIDENCE/P09/sca_summary.md
          fi

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-sca-evidence
          path: |
            EVIDENCE/P09/*
          retention-days: 30

