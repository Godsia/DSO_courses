name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/ci-sast-secrets.yml"
      - "security/**"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/ci-sast-secrets.yml"
      - "security/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    name: Security - SAST & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create evidence directory
        run: mkdir -p EVIDENCE/P10

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -w /src \
            returntocorp/semgrep:latest \
            semgrep ci \
              --config p/ci \
              --config /src/security/semgrep/rules.yml \
              --sarif \
              --output /src/EVIDENCE/P10/semgrep.sarif \
              --metrics=off \
              --no-git-ignore || true

      - name: Run Gitleaks secrets scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --no-banner \
              --config=/repo/security/.gitleaks.toml \
              --source=/repo \
              --report-format=json \
              --report-path=/repo/EVIDENCE/P10/gitleaks.json \
              --no-git || true

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-secrets-evidence
          path: |
            EVIDENCE/P10/*
          retention-days: 30

