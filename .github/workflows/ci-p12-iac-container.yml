name: Security - IaC & Container (P12)

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile*"
      - "iac/**"
      - "k8s/**"
      - "deploy/**"
      - ".github/workflows/ci-p12-iac-container.yml"
      - "security/**"
  pull_request:
    paths:
      - "Dockerfile*"
      - "iac/**"
      - "k8s/**"
      - "deploy/**"
      - ".github/workflows/ci-p12-iac-container.yml"
      - "security/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac-container-security:
    name: IaC & Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create evidence directory
        run: mkdir -p EVIDENCE/P12

      - name: Build Docker image
        run: |
          docker build -t dso-courses-api:local -f Dockerfile .
          echo "Image built successfully"

      - name: Run Hadolint on Dockerfile
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            hadolint/hadolint:latest \
            hadolint \
            --config /workspace/security/hadolint.yaml \
            --format json \
            /workspace/Dockerfile > EVIDENCE/P12/hadolint_report.json 2>&1 || true
          echo "Hadolint scan completed"
          # If JSON is empty, create a valid JSON structure
          if [ ! -s EVIDENCE/P12/hadolint_report.json ]; then
            echo "[]" > EVIDENCE/P12/hadolint_report.json
          fi

      - name: Run Checkov on IaC
        run: |
          # Remove existing report file/directory if exists
          rm -rf EVIDENCE/P12/checkov_report.json
          
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            bridgecrew/checkov:latest \
            --directory /workspace/iac \
            --framework kubernetes \
            --framework dockerfile \
            --output json \
            --output-file /workspace/EVIDENCE/P12/checkov_report.json \
            --quiet || true
          
          echo "Checkov scan completed"
          
          # Check if output is a directory and handle it
          if [ -d EVIDENCE/P12/checkov_report.json ]; then
            echo "Warning: Checkov created a directory instead of file, trying to find JSON inside"
            find EVIDENCE/P12/checkov_report.json -name "*.json" -type f | head -1 | xargs -I {} mv {} EVIDENCE/P12/checkov_report.json || true
            rm -rf EVIDENCE/P12/checkov_report.json
          fi
          
          # If JSON is empty or doesn't exist, create a valid JSON structure
          if [ ! -f EVIDENCE/P12/checkov_report.json ] || [ ! -s EVIDENCE/P12/checkov_report.json ]; then
            echo '{"summary": {"passed": 0, "failed": 0, "skipped": 0}, "results": {}}' > EVIDENCE/P12/checkov_report.json
          fi

      - name: Run Trivy on Docker image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            aquasec/trivy:latest \
            image \
            --format json \
            --output /workspace/EVIDENCE/P12/trivy_report.json \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            dso-courses-api:local || true
          echo "Trivy scan completed"

      - name: Generate summary report
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime, timezone
          
          summary_file = "EVIDENCE/P12/security_summary.md"
          commit_sha = os.environ.get("GITHUB_SHA", "unknown")
          
          summary = []
          summary.append("# Security Scan Summary (P12)")
          summary.append("")
          summary.append(f"Generated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}")
          summary.append(f"Commit: {commit_sha}")
          summary.append("")
          
          # Helper function to safely read JSON file
          def read_json_file(filepath):
              try:
                  if not os.path.exists(filepath):
                      return None
                  if not os.path.isfile(filepath):
                      print(f"Warning: {filepath} is not a file (might be a directory)")
                      return None
                  with open(filepath, "r") as f:
                      return json.load(f)
              except (json.JSONDecodeError, IOError) as e:
                  print(f"Error reading {filepath}: {e}")
                  return None
          
          # Hadolint summary
          hadolint_data = read_json_file("EVIDENCE/P12/hadolint_report.json")
          if hadolint_data and isinstance(hadolint_data, list):
              errors = sum(1 for item in hadolint_data if item.get("level") == "error")
              warnings = sum(1 for item in hadolint_data if item.get("level") == "warning")
              summary.append("## Hadolint (Dockerfile)")
              summary.append(f"- Errors: {errors}")
              summary.append(f"- Warnings: {warnings}")
          else:
              summary.append("## Hadolint (Dockerfile)")
              summary.append("- Report not available")
          
          # Checkov summary
          checkov_data = read_json_file("EVIDENCE/P12/checkov_report.json")
          if checkov_data and isinstance(checkov_data, dict):
              summary_data = checkov_data.get("summary", {})
              passed = summary_data.get("passed", 0)
              failed = summary_data.get("failed", 0)
              skipped = summary_data.get("skipped", 0)
              summary.append("")
              summary.append("## Checkov (IaC)")
              summary.append(f"- Passed: {passed}")
              summary.append(f"- Failed: {failed}")
              summary.append(f"- Skipped: {skipped}")
          else:
              summary.append("")
              summary.append("## Checkov (IaC)")
              summary.append("- Report not available")
          
          # Trivy summary
          trivy_data = read_json_file("EVIDENCE/P12/trivy_report.json")
          if trivy_data and isinstance(trivy_data, dict):
              results = trivy_data.get("Results", [])
              critical = 0
              high = 0
              medium = 0
              low = 0
              for result in results:
                  for vuln in result.get("Vulnerabilities", []):
                      severity = vuln.get("Severity", "").upper()
                      if severity == "CRITICAL":
                          critical += 1
                      elif severity == "HIGH":
                          high += 1
                      elif severity == "MEDIUM":
                          medium += 1
                      elif severity == "LOW":
                          low += 1
              summary.append("")
              summary.append("## Trivy (Container Image)")
              summary.append(f"- Critical: {critical}")
              summary.append(f"- High: {high}")
              summary.append(f"- Medium: {medium}")
              summary.append(f"- Low: {low}")
          else:
              summary.append("")
              summary.append("## Trivy (Container Image)")
              summary.append("- Report not available")
          
          summary.append("")
          summary.append("## Next Steps")
          summary.append("- Review findings in detail reports")
          summary.append("- Fix critical and high severity issues")
          summary.append("- Update base images and dependencies as needed")
          
          with open(summary_file, "w") as f:
              f.write("\n".join(summary))
          print("Summary report generated")
          EOF
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P12_EVIDENCE
          path: |
            EVIDENCE/P12/*
          retention-days: 30

