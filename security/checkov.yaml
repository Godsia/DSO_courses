# Checkov configuration
framework:
  - kubernetes
  - dockerfile

# Skip checks that are not relevant
skip-checks:
  # Skip checks for specific IDs if needed
  # - CKV_K8S_*

# Include/exclude paths
include-check:
  - CKV_DOCKER_*  # Include all Dockerfile checks
  - CKV_K8S_*     # Include all Kubernetes checks

# Exclude paths from scanning
exclude-path:
  - "**/node_modules/**"
  - "**/.git/**"

